version: "1.0"
name: "S33 Wide Fanout (5 Parallel Generates)"

nodes:
  - id: start
    type: start

  - id: gen1
    type: generate
    config:
      provider: openai
      model: gpt-4o-mini
      template: tpl_perspective
      variables:
        topic: "start.topic"
        perspective: "start.perspective1"

  - id: gen2
    type: generate
    config:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      template: tpl_perspective
      variables:
        topic: "start.topic"
        perspective: "start.perspective2"

  - id: gen3
    type: generate
    config:
      provider: deepseek
      model: deepseek-chat
      template: tpl_perspective
      variables:
        topic: "start.topic"
        perspective: "start.perspective3"

  - id: gen4
    type: generate
    config:
      provider: qwen
      model: qwen-flash
      template: tpl_perspective
      variables:
        topic: "start.topic"
        perspective: "start.perspective4"

  - id: gen5
    type: generate
    config:
      provider: xai
      model: grok-4-fast
      template: tpl_perspective
      variables:
        topic: "start.topic"
        perspective: "start.perspective5"

  - id: merge
    type: transform
    config:
      script: |
        #{
          "perspectives": [p1, p2, p3, p4, p5],
          "provider_count": 5
        }
      variables:
        p1: "gen1.output"
        p2: "gen2.output"
        p3: "gen3.output"
        p4: "gen4.output"
        p5: "gen5.output"

  - id: response
    type: response
    config:
      output:
        perspectives: "merge.perspectives"
        provider_count: "merge.provider_count"

edges:
  - from: start
    to: gen1
  - from: start
    to: gen2
  - from: start
    to: gen3
  - from: start
    to: gen4
  - from: start
    to: gen5
  - from: gen1
    to: merge
  - from: gen2
    to: merge
  - from: gen3
    to: merge
  - from: gen4
    to: merge
  - from: gen5
    to: merge
  - from: merge
    to: response

templates:
  tpl_perspective:
    user_prompt: "From the perspective of {{perspective}}, briefly comment on: {{topic}} (2-3 sentences)"
    config:
      temperature: 0.7
      max_tokens: 150
