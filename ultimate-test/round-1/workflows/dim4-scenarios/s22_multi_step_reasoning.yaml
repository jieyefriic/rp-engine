version: "1.0"
name: "S22 Multi-Step Reasoning with Confidence Gate"

nodes:
- id: start
  type: start

- id: think
  type: generate
  config:
    provider: xai
    model: grok-4-fast
    template: tpl_think
    variables:
      problem: "start.problem"
      previous_thoughts: "think[*].reasoning"
- id: check_confidence
  type: transform
  config:
    script: |
      let conf = confidence;
      let needs_more = needs_more;
      #{
        "should_continue": if conf < 0.8 && needs_more { true } else { false },
        "current_confidence": conf
      }
    variables:
      confidence: "think.confidence"
      needs_more: "think.needs_more_thought"

- id: final_answer
  type: generate
  config:
    provider: xai
    model: grok-4-fast
    template: tpl_final
    variables:
      problem: "start.problem"
      all_reasoning: "think[*].reasoning"

- id: response
  type: response
  config:
    output:
      reasoning_steps: "think[*].reasoning"
      final_answer: "final_answer.output"

edges:
- from: start
  to: think
- from: think
  to: check_confidence
- from: check_confidence
  to: think
  condition: check_confidence.should_continue == true
  max_iterations: 4
- from: check_confidence
  to: final_answer
  condition: check_confidence.should_continue == false
- from: check_confidence
  to: final_answer
  is_default: true
- from: final_answer
  to: response

templates:
  tpl_think:
    system_prompt: "You are a careful, step-by-step reasoner. Evaluate your confidence honestly."
    user_prompt: |
      Problem: {{problem}}

      Previous reasoning steps: {{previous_thoughts}}

      Think about this problem step by step. Rate your confidence (0-1).
    config:
      temperature: 0.5
      max_tokens: 400

    output_schema:
    - name: reasoning
      type: string
      example: "Step 1: I need to consider..."
    - name: confidence
      type: number
      example: "0.7"
    - name: needs_more_thought
      type: boolean
      example: "true"

  tpl_final:
    user_prompt: |
      Problem: {{problem}}

      My reasoning process:
      {{all_reasoning}}

      Based on this reasoning, provide a clear, definitive answer.
    config:
      temperature: 0.3
      max_tokens: 300
