version: "1.0"
name: "S09 Multi-DB Dashboard (PG + Redis)"

data_sources:
  pg_test:
    name: "PostgreSQL"
    kind: postgresql
    config:
      host: "localhost"
      port: 5432
      username: "testuser"
      password: "testpass"
      database: "testdb"
  redis_cache:
    name: "Redis"
    kind: redis
    config:
      url: "redis://localhost:6379/0"

nodes:
  - id: start
    type: start

  - id: pg_query
    type: data_connector
    config:
      data_source_id: pg_test
      operation:
        operation: query
        sql: "SELECT COUNT(*)::int as total_users, AVG(age)::int as avg_age, AVG(score)::float as avg_score FROM simple_test"

  - id: redis_info
    type: data_connector
    config:
      data_source_id: redis_cache
      operation:
        operation: get
        key_template: "cache:summary:quantum computing"

  - id: merge
    type: transform
    config:
      script: |
        #{
          "pg_data": pg_data,
          "redis_exists": redis_exists
        }
      variables:
        pg_data: "pg_query.data"
        redis_exists: "redis_info.exists"

  - id: narrate
    type: generate
    config:
      provider: deepseek
      model: deepseek-chat
      template: tpl_narrate
      variables:
        pg_stats: "pg_query.data"
        cache_exists: "redis_info.exists"

  - id: response
    type: response
    config:
      output:
        pg_data: "merge.pg_data"
        redis_exists: "merge.redis_exists"
        narrative: "narrate.output"

edges:
  - from: start
    to: pg_query
  - from: start
    to: redis_info
  - from: pg_query
    to: merge
  - from: redis_info
    to: merge
  - from: merge
    to: narrate
  - from: narrate
    to: response

templates:
  tpl_narrate:
    user_prompt: "Create a brief dashboard summary. Database stats: {{pg_stats}}. Redis cache available: {{cache_exists}}."
    config:
      temperature: 0.5
      max_tokens: 200
