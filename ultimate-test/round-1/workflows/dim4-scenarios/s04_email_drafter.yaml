version: "1.0"
name: "S04 Email Drafter with Tone"

nodes:
  - id: start
    type: start

  - id: analyze_tone
    type: generate
    config:
      provider: openai
      model: gpt-4o-mini
      template: tpl_analyze
      variables:
        context: "start.context"
      output_schema:
        - name: tone
          type: string
          example: "formal"

  - id: draft_email
    type: generate
    config:
      provider: openai
      model: gpt-4o-mini
      template:
        default: tpl_draft_casual
        conditions:
          - when: analyze_tone.tone == 'formal'
            use: tpl_draft_formal
      variables:
        context: "start.context"
        recipient: "start.recipient"
        tone: "analyze_tone.tone"

  - id: response
    type: response
    config:
      output:
        detected_tone: "analyze_tone.tone"
        email: "draft_email.output"

edges:
  - from: start
    to: analyze_tone
  - from: analyze_tone
    to: draft_email
  - from: draft_email
    to: response

templates:
  tpl_analyze:
    system_prompt: "You are a communication style analyst. Classify the tone as either 'formal' or 'casual'."
    user_prompt: "Analyze the tone needed for this email context: {{context}}\n\nReturn either 'formal' or 'casual'."
    config:
      temperature: 0.1
      max_tokens: 50

  tpl_draft_formal:
    system_prompt: "You are a professional business writer. Use formal language, proper salutations, and a structured format."
    user_prompt: "Draft a formal email to {{recipient}} about: {{context}}"
    config:
      temperature: 0.5
      max_tokens: 400

  tpl_draft_casual:
    system_prompt: "You are a friendly, casual communicator. Use a warm, conversational tone."
    user_prompt: "Draft a casual email to {{recipient}} about: {{context}}"
    config:
      temperature: 0.7
      max_tokens: 400
