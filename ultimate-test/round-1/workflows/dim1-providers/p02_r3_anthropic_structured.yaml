version: "1.0"
name: "P02_R3 Anthropic Structured Output"

nodes:
  - id: start
    type: start

  - id: gen
    type: generate
    config:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      template: tpl_structured
      variables:
        query: "start.query"
      output_schema:
        - name: summary
          type: string
          example: "A brief summary"
        - name: confidence
          type: number
          example: "0.85"
        - name: category
          type: string
          example: "science"

  - id: response
    type: response
    config:
      output:
        answer: "gen.output"

edges:
  - from: start
    to: gen
  - from: gen
    to: response

templates:
  tpl_structured:
    user_prompt: "Analyze this topic and provide a structured response: {{query}}"
    config:
      temperature: 0.7
      max_tokens: 200
