version: "1.0"
name: "P06_R1 Qwen Basic Chat"

nodes:
  - id: start
    type: start

  - id: gen
    type: generate
    config:
      provider: qwen
      model: qwen-flash
      template: tpl_basic
      variables:
        query: "start.query"

  - id: response
    type: response
    config:
      output:
        answer: "gen.output"

edges:
  - from: start
    to: gen
  - from: gen
    to: response

templates:
  tpl_basic:
    user_prompt: "{{query}}"
    config:
      temperature: 0.7
      max_tokens: 200
