version: "1.0"
name: "P04_R10 DeepSeek Max Tokens Constraint"

nodes:
  - id: start
    type: start

  - id: gen
    type: generate
    config:
      provider: deepseek
      model: deepseek-chat
      template: tpl_maxtokens
      variables:
        query: "start.query"

  - id: response
    type: response
    config:
      output:
        answer: "gen.output"

edges:
  - from: start
    to: gen
  - from: gen
    to: response

templates:
  tpl_maxtokens:
    user_prompt: "Explain quantum computing in detail: {{query}}"
    config:
      max_tokens: 20
      temperature: 0.3
