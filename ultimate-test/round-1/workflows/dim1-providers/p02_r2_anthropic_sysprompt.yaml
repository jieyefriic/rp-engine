version: "1.0"
name: "P02_R2 Anthropic System Prompt"

nodes:
  - id: start
    type: start

  - id: gen
    type: generate
    config:
      provider: anthropic
      model: claude-haiku-4-5-20251001
      template: tpl_sysprompt
      variables:
        query: "start.query"

  - id: response
    type: response
    config:
      output:
        answer: "gen.output"

edges:
  - from: start
    to: gen
  - from: gen
    to: response

templates:
  tpl_sysprompt:
    system_prompt: "You are a helpful math tutor. Always explain step by step."
    user_prompt: "{{query}}"
    config:
      temperature: 0.7
      max_tokens: 200
