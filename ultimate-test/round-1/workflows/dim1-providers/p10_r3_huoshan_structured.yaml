version: "1.0"
name: "P10_R3 Huoshan Structured Output"

nodes:
- id: start
  type: start

- id: gen
  type: generate
  config:
    provider: huoshan
    model: doubao-seed-2-0-lite-260215
    template: tpl_structured
    variables:
      query: "start.query"
- id: response
  type: response
  config:
    output:
      answer: "gen.output"

edges:
- from: start
  to: gen
- from: gen
  to: response

templates:
  tpl_structured:
    user_prompt: "Analyze this topic and provide a structured response: {{query}}"
    config:
      temperature: 0.7
      max_tokens: 200
    output_schema:
    - name: summary
      type: string
      example: "A brief summary"
    - name: confidence
      type: number
      example: "0.85"
    - name: category
      type: string
      example: "science"

