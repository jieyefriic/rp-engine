version: "1.0"
name: "D02 PostgreSQL INSERT + SELECT Round-trip"

data_sources:
  pg_test:
    name: "Test PostgreSQL"
    kind: postgresql
    config:
      host: "localhost"
      port: 5432
      username: "testuser"
      password: "testpass"
      database: "testdb"

nodes:
  - id: start
    type: start

  - id: insert
    type: data_connector
    config:
      data_source_id: pg_test
      operation:
        operation: insert
        table: test_types
        data:
          name: "{ins_name}"
          score: "{ins_score}"
          is_active: "{ins_active}"
        returning: ["id", "name", "score"]
      variables:
        ins_name: "start.name"
        ins_score: "start.score"
        ins_active: "start.is_active"

  - id: read_back
    type: data_connector
    config:
      data_source_id: pg_test
      operation:
        operation: query
        sql: "SELECT id, name, score, is_active FROM test_types WHERE name = {lookup_name} ORDER BY id DESC LIMIT 1"
      variables:
        lookup_name: "start.name"

  - id: response
    type: response
    config:
      output:
        inserted: "insert.data"
        read_back: "read_back.data"

edges:
  - from: start
    to: insert
  - from: insert
    to: read_back
  - from: read_back
    to: response
