version: "1.0"
name: "N07 Multiple Source Variable Binding"

nodes:
  - id: start
    type: start

  - id: gen
    type: generate
    config:
      provider: deepseek
      model: deepseek-chat
      template: tpl
      variables:
        context: ["start.extra_context", "start.query"]

  - id: response
    type: response
    config:
      output:
        answer: "gen.output"

edges:
  - from: start
    to: gen
  - from: gen
    to: response

templates:
  tpl:
    user_prompt: "Answer based on this context: {{context}}"
    config:
      temperature: 0.5
      max_tokens: 200
