version: "1.0"
name: "N06 Variable Single Binding"

nodes:
  - id: start
    type: start

  - id: gen
    type: generate
    config:
      provider: deepseek
      model: deepseek-chat
      template: tpl_gen
      variables:
        query: "start.query"

  - id: response
    type: response
    config:
      output:
        answer: "gen.output"

edges:
  - from: start
    to: gen
  - from: gen
    to: response

templates:
  tpl_gen:
    user_prompt: "Answer this question concisely: {{query}}"
    config:
      temperature: 0.7
      max_tokens: 200
