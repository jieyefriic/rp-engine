version: "1.0"
name: "N01 Basic Generate"

nodes:
  - id: start
    type: start

  - id: gen
    type: generate
    config:
      provider: deepseek
      model: deepseek-chat
      template: tpl
      variables:
        query: "start.query"

  - id: response
    type: response
    config:
      output:
        answer: "gen.output"

edges:
  - from: start
    to: gen
  - from: gen
    to: response

templates:
  tpl:
    user_prompt: "{{query}}"
    config:
      temperature: 0.7
      max_tokens: 150
