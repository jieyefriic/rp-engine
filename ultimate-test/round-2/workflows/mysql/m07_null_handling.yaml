version: "1.0"
name: "M07 MySQL NULL Handling"

data_sources:
  mysql_test:
    name: "Test MySQL"
    kind: mysql
    config:
      host: "localhost"
      port: 13306
      username: "test"
      password: "test"
      database: "testdb"

nodes:
  - id: start
    type: start

  - id: insert_null
    type: data_connector
    config:
      data_source_id: mysql_test
      operation:
        operation: insert
        table: ut_types
        data:
          name: "NullTest_M07"
          score: null
          is_active: null
          description: null
          metadata: null

  - id: read_back
    type: data_connector
    config:
      data_source_id: mysql_test
      operation:
        operation: query
        sql: "SELECT name, score, is_active, description, metadata FROM ut_types WHERE name = 'NullTest_M07' ORDER BY id DESC LIMIT 1"

  - id: response
    type: response
    config:
      output:
        insert_id: "insert_null.last_insert_id"
        row: "read_back.rows"
        name: "read_back.name"
        score: "read_back.score"
        is_active: "read_back.is_active"
        description: "read_back.description"

edges:
  - from: start
    to: insert_null
  - from: insert_null
    to: read_back
  - from: read_back
    to: response
