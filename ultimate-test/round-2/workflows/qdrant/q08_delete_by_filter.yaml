version: "1.0"
name: "Q08 Qdrant Delete by Filter"

data_sources:
  qdrant_test:
    name: "Test Qdrant"
    kind: qdrant
    config:
      url: "http://localhost:16334"

nodes:
  - id: start
    type: start

  - id: upsert_temp
    type: data_connector
    config:
      data_source_id: qdrant_test
      operation:
        operation: upsert
        collection: "ut_vectors"
        points:
          - id: 200
            vector: [0.2, 0.2, 0.2, 0.2]
            payload:
              text: "temp item 1"
              category: "deleteme"
          - id: 201
            vector: [0.3, 0.3, 0.3, 0.3]
            payload:
              text: "temp item 2"
              category: "deleteme"

  - id: delete_by_filter
    type: data_connector
    config:
      data_source_id: qdrant_test
      operation:
        operation: delete
        collection: "ut_vectors"
        filter:
          must:
            - key: "category"
              match:
                value: "deleteme"

  - id: verify
    type: data_connector
    config:
      data_source_id: qdrant_test
      operation:
        operation: search
        collection: "ut_vectors"
        vector: [0.25, 0.25, 0.25, 0.25]
        limit: 10
        with_payload: true
        filter:
          must:
            - key: "category"
              match:
                value: "deleteme"

  - id: response
    type: response
    config:
      output:
        upsert_count: "upsert_temp.count"
        delete_success: "delete_by_filter.success"
        remaining: "verify.results"
        remaining_count: "verify.count"

edges:
  - from: start
    to: upsert_temp
  - from: upsert_temp
    to: delete_by_filter
  - from: delete_by_filter
    to: verify
  - from: verify
    to: response
