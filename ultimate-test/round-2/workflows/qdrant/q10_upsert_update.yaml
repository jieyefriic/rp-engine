version: "1.0"
name: "Q10 Qdrant Upsert Update (Overwrite)"

data_sources:
  qdrant_test:
    name: "Test Qdrant"
    kind: qdrant
    config:
      url: "http://localhost:16334"

nodes:
  - id: start
    type: start

  - id: upsert_original
    type: data_connector
    config:
      data_source_id: qdrant_test
      operation:
        operation: upsert
        collection: "ut_vectors"
        points:
          - id: 300
            vector: [0.1, 0.2, 0.3, 0.4]
            payload:
              text: "original content"
              version: 1

  - id: upsert_updated
    type: data_connector
    config:
      data_source_id: qdrant_test
      operation:
        operation: upsert
        collection: "ut_vectors"
        points:
          - id: 300
            vector: [0.4, 0.3, 0.2, 0.1]
            payload:
              text: "updated content"
              version: 2
              new_field: "added"

  - id: verify
    type: data_connector
    config:
      data_source_id: qdrant_test
      operation:
        operation: get_points
        collection: "ut_vectors"
        ids: [300]
        with_payload: true
        with_vectors: true

  - id: response
    type: response
    config:
      output:
        original_ok: "upsert_original.success"
        updated_ok: "upsert_updated.success"
        final_points: "verify.points"
        final_count: "verify.count"

edges:
  - from: start
    to: upsert_original
  - from: upsert_original
    to: upsert_updated
  - from: upsert_updated
    to: verify
  - from: verify
    to: response
