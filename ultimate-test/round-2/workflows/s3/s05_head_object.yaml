version: "1.0"
name: "S05 S3 Head Object (Metadata)"

data_sources:
  minio_test:
    name: "Test MinIO"
    kind: s3
    config:
      endpoint: "http://127.0.0.1:19000"
      access_key: "minioadmin"
      secret_key: "minioadmin"
      region: "us-east-1"

nodes:
  - id: start
    type: start

  - id: put
    type: data_connector
    config:
      data_source_id: minio_test
      operation:
        operation: put_object
        bucket: "ut-head-bucket"
        prefix: "headtest"
        content_type: "text/plain"
      variables:
        data: "start.data"

  - id: head
    type: data_connector
    config:
      data_source_id: minio_test
      operation:
        operation: head_object
        bucket: "ut-head-bucket"
        key: "{{put.key}}"

  - id: response
    type: response
    config:
      output:
        exists: "head.exists"
        content_type: "head.content_type"
        size: "head.size"
        last_modified: "head.last_modified"

edges:
  - from: start
    to: put
  - from: put
    to: head
  - from: head
    to: response
