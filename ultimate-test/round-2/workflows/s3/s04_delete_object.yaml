version: "1.0"
name: "S04 S3 Delete Object + Verify"

data_sources:
  minio_test:
    name: "Test MinIO"
    kind: s3
    config:
      endpoint: "http://127.0.0.1:19000"
      access_key: "minioadmin"
      secret_key: "minioadmin"
      region: "us-east-1"

nodes:
  - id: start
    type: start

  - id: put
    type: data_connector
    config:
      data_source_id: minio_test
      operation:
        operation: put_object
        bucket: "ut-delete-bucket"
        prefix: "deltest"
        content_type: "text/plain"
      variables:
        data: "start.data"

  - id: delete
    type: data_connector
    config:
      data_source_id: minio_test
      operation:
        operation: delete_object
        bucket: "ut-delete-bucket"
        key: "{{put.key}}"

  - id: verify
    type: data_connector
    config:
      data_source_id: minio_test
      operation:
        operation: head_object
        bucket: "ut-delete-bucket"
        key: "{{put.key}}"

  - id: response
    type: response
    config:
      output:
        uploaded_key: "put.key"
        deleted: "delete.deleted"
        still_exists: "verify.exists"

edges:
  - from: start
    to: put
  - from: put
    to: delete
  - from: delete
    to: verify
  - from: verify
    to: response
