[package]
name = "riceprompt-engine"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "YAML-native Agent workflow execution engine"
repository = "https://github.com/anthropics/riceprompt-engine"
keywords = ["agent", "workflow", "llm", "yaml"]
categories = ["development-tools", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Data Connectors
# Object Storage (S3-compatible)
aws-sdk-s3 = "1.65"
aws-config = "1.5"
aws-credential-types = "1.2"

# PostgreSQL
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
deadpool-postgres = "0.14"

# MySQL
mysql_async = { version = "0.34", features = ["chrono"] }

# MongoDB
mongodb = "3"

# Vector Database
qdrant-client = "1.13"

# Redis
redis = { version = "0.27", features = ["tokio-comp", "json", "connection-manager"] }

# Utilities
thiserror = "2"
tracing = "0.1"
regex-lite = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.19.0", features = ["v4"] }

# Template rendering
handlebars = "6"

# Scripting engine for transform nodes
rhai = { version = "1", features = ["sync"] }
postgres-types = { version = "0.2.12", features = ["with-serde_json-1"] }
bytes = "1.11.1"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
tempfile = "3"
